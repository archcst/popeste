<style>
*{box-sizing:border-box} :root{--paper:#fff;--ink:#303235;--muted:#95999e;--line:#eceef0;--hover:#f5f6f7;--selected:#eceef0;--black:#111;--stage:#eceef0;--scale:.9}

body{margin:0;background:var(--stage);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:hover{background:var(--hover)}button:focus-visible,select:focus-visible{outline:2px solid #979da4;outline-offset:2px}input,textarea{outline:0}button:disabled{opacity:.35;cursor:default}

.stage{min-height:610px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:30px}.frame{zoom:var(--scale)}.window{width:480px;height:424px;display:flex;flex-direction:column;background:var(--paper);border:0;border-radius:19px;box-shadow:0 18px 60px #202b3918,0 2px 6px #00000005;overflow:hidden;position:relative}.head{height:57px;display:flex;align-items:center;gap:11px;padding:0 17px;border-bottom:1px solid var(--line);flex-shrink:0}.head input{width:100%;flex:1;min-width:0;border:0;background:none;font-size:17px}.head input::placeholder,textarea::placeholder{color:var(--muted)}.head strong{font-weight:500;font-size:14px}.spacer{flex:1}.icon{width:17px;height:17px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.muted{color:var(--muted)}.iconbutton{display:grid;place-items:center;border-radius:7px;width:29px;height:29px;padding:0;color:var(--muted)}kbd{background:var(--hover);border-radius:4px;padding:3px 5px;font:10px -apple-system,sans-serif;color:var(--muted)}
.page{display:none;min-height:0;flex:1;flex-direction:column}.page.active{display:flex}.list{flex:1;min-height:0;overflow:auto;padding:7px}.row{width:100%;display:block;white-space:nowrap;text-overflow:clip;overflow:hidden;text-align:left;padding:11px 12px;line-height:24px;border-radius:10px;font-size:17px;font-weight:400}.row.selected{background:var(--selected)}.empty{padding:42px 12px;text-align:center;color:var(--muted);font-size:13px}.footer{height:45px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 12px;border-top:1px solid var(--line)}.hint{font-size:10px;color:var(--muted)}.textbutton{padding:6px 9px;font-size:12px;border-radius:6px;color:var(--muted)}.primary{background:var(--black);color:var(--paper);padding:7px 15px;font-size:12px;border-radius:8px}.primary:hover{background:var(--black);opacity:.85}
.editor{flex:1;display:flex;min-height:0;padding:15px 18px 10px;flex-direction:column;gap:8px}.editor textarea{flex:1;min-height:0;resize:none;border:0;background:transparent;padding:0;margin:0;font-size:17px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;letter-spacing:normal;appearance:none}.editor-meta{display:flex;align-items:center;font-size:10px;color:var(--muted);gap:8px}.pin{display:flex;align-items:center;gap:5px;border-radius:6px;padding:5px 6px;font-size:11px}.pin[aria-pressed=true]{background:var(--selected);color:var(--ink)}.danger:hover{color:#c14d49}.settings{padding:0 18px;overflow:auto;flex:1}.setting{display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:46px;border-bottom:1px solid var(--line);font-size:13px}.setting:last-child{border-bottom:0}.shortcut{padding:5px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;min-width:56px}.segments{display:flex;background:var(--hover);padding:3px;border-radius:7px;gap:2px}.segments button{padding:4px 11px;border-radius:5px;font-size:11px;color:var(--muted)}.segments button[aria-pressed=true]{background:var(--paper);box-shadow:0 1px 3px #0000000b;color:var(--ink)}select{background:var(--paper);border:0;font-size:12px;max-width:115px}.toggle{width:30px;height:18px;border-radius:20px;background:#d3d6d9;padding:2px;display:flex;align-items:center}.toggle i{width:14px;height:14px;border-radius:50%;background:white;box-shadow:0 1px 2px #0002}.toggle[aria-checked=true]{background:var(--black);justify-content:flex-end}.dark .toggle[aria-checked=true] i{background:#252628}.permission{font-size:11px;color:#709580;display:flex;align-items:center;gap:7px}.permission:before{content:'';width:5px;height:5px;background:currentColor;border-radius:50%}.storage{padding:10px 0;color:var(--muted);font-size:10px;display:flex;align-items:center;gap:10px}.backup{display:flex;gap:3px}.subtle{font-size:11px;color:var(--muted)}.caption{text-align:center;max-width:440px;font-size:12px;line-height:1.9;color:#858b91}.caption strong{font-weight:500;color:var(--ink)}.legend{display:flex;justify-content:space-between;border-top:1px solid #dce0e3;padding-top:18px;font-size:11px;color:#92989e;gap:16px}.toast{position:absolute;bottom:55px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:8px;background:var(--black);color:var(--paper);font-size:11px;white-space:nowrap;pointer-events:none;opacity:0}.toast.show{opacity:1}.confirm{position:absolute;inset:0;background:#0002;display:grid;place-items:center;padding:30px}.confirm[hidden]{display:none}.dialog{padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:14px;width:100%;box-shadow:0 10px 30px #0001}.dialog p{font-size:12px;color:var(--muted);line-height:1.7}.dialog-actions{display:flex;justify-content:flex-end;gap:4px;margin-top:20px}.dialog-actions .textbutton{padding:6px 5px}.dialog-actions #accept{margin-left:6px}.dialog-actions .textbutton:focus-visible{outline:none;color:var(--muted)}@media(max-width:620px){.board{padding:22px 12px}.mast{align-items:flex-start;flex-direction:column}.stage{min-height:540px}.legend{flex-direction:column}.frame{max-width:100%}.window{max-width:calc((100vw - 30px) / var(--scale))}.badge{font-size:11px}.caption{padding:0 12px}}

.prompt-row{position:relative;display:flex;align-items:center;border-radius:10px;min-width:0}
.prompt-row.selected{background:var(--selected)}.prompt-row:hover{background:var(--hover)}.prompt-row.selected:hover{background:var(--selected)}
.prompt-row .row{flex:1;min-width:0;width:auto;background:transparent}
.prompt-row .row.overflowing{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 44px),transparent calc(100% - 10px));mask-image:linear-gradient(to right,#000 calc(100% - 44px),transparent calc(100% - 10px))}
.row-edit{position:absolute;right:7px;top:50%;transform:translateY(-50%);z-index:1;background:var(--paper);opacity:0;pointer-events:none}
.prompt-row:hover .row-edit,.prompt-row:focus-within .row-edit{opacity:1;pointer-events:auto}
.row-edit:hover{background:var(--paper)}
.empty button{display:block;margin:15px auto 0}
@supports (corner-shape: superellipse(2)){.window{corner-shape:superellipse(2)}}
#list > .footer,#editor > .footer{position:relative}.footer-shortcuts{position:absolute;left:50%;transform:translateX(-50%);white-space:pre;pointer-events:none}

.select-control{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:6px 8px;border-radius:7px;font-size:12px;white-space:nowrap}
.select-control .chevron{width:12px;height:12px;color:var(--muted)}
.setting{position:relative}.setting-menu{position:absolute;right:0;top:calc(100% - 3px);z-index:10;min-width:138px;max-height:230px;overflow-y:auto;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 20px #0002}
.setting-menu[hidden]{display:none}.setting-menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:5px;font-size:12px}
.config-label{display:flex;align-items:center;gap:12px;min-width:0}.config-path{font-size:11px;color:var(--muted);white-space:nowrap}.config-row{gap:6px}
#settings .setting{min-height:39px}#settingsButton .icon{width:18px;height:18px}
.window.compact{height:57px}.window.compact #list .list,.window.compact #list > .footer{display:none}.window.compact #list .head{border-bottom:0}
.expand-hint{display:none;flex-shrink:0;white-space:nowrap;pointer-events:none;font-size:12px}.window.compact .expand-hint{display:inline}
.insert-button{display:flex;align-items:center;gap:7px}.insert-button .icon{width:13px;height:13px}
.shortcut-controls{position:relative;display:flex;align-items:center;gap:12px}
.option-check{display:inline-block;width:18px;color:var(--ink)}.shortcut-controls #keymap{max-width:180px}.shortcut-controls #keymap > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vim-input{position:relative;flex:1;min-height:0;overflow:hidden;display:flex}.vim-input textarea{width:100%}.vim-caret-mirror{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;box-sizing:border-box}.vim-block-caret{position:absolute;background:#000;color:#fff;pointer-events:none;white-space:pre;overflow:hidden}.dark .vim-block-caret{background:#fff;color:#000}.vim-block-caret[hidden]{display:none}

<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></symbol><symbol id="icon-back" viewBox="0 0 24 24"><path d="m10 5-7 7 7 7M3 12h17"/></symbol><symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="icon-edit" viewBox="0 0 24 24"><path d="m14 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></symbol><symbol id="icon-gear" viewBox="0 0 24 24"><path d="M4 7h4m4 0h8M4 17h8m4 0h4"/><circle cx="10" cy="7" r="2"/><circle cx="14" cy="17" r="2"/></symbol><symbol id="icon-pin" viewBox="0 0 24 24"><path d="M8 3h8l-1 7 3 4H6l3-4zM12 14v7"/></symbol><symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol></svg>
<div class="board">
<header class="mast"><div class="brand">Popaste <span class="badge">紧凑浮窗 · 设计预览</span></div><nav class="modes" aria-label="预览状态"><button data-mode="list" class="active">短语</button><button data-mode="editor">编辑</button><button data-mode="settings">设置</button></nav></header>
<main class="stage"><div class="frame"><section class="window compact" aria-label="Popaste 浮窗">
<div id="list" class="page active"><header class="head"><svg class="icon muted"><use href="#icon-search"/></svg><input id="query" placeholder="搜索短语" aria-label="搜索短语" spellcheck="false"><span class="expand-hint hint"><span id="expandKeys">↓</span> <span>展开</span></span></header><div class="list" id="rows"></div><footer class="footer"><button class="iconbutton" id="new" aria-label="新建短语" title="新建短语（⌘N）"><svg class="icon"><use href="#icon-plus"/></svg></button><span class="hint" id="count"></span><span class="footer-shortcuts hint">⌘N 新建  ·  ⌘E 编辑  ·  ↵ 插入</span><span class="spacer"></span><button class="iconbutton" id="settingsButton" aria-label="设置" title="设置（⌘,）"><svg class="icon"><use href="#icon-gear"/></svg></button></footer></div>
<div id="editor" class="page"><header class="head"><button class="iconbutton" data-back aria-label="返回短语"><svg class="icon"><use href="#icon-back"/></svg></button><strong id="editorHeading">编辑短语</strong><span class="spacer"></span><button class="pin" id="pin" aria-pressed="false"><svg class="icon" style="width:13px;height:13px"><use href="#icon-pin"/></svg>置顶</button></header><div class="editor"><textarea id="body" placeholder="输入短语正文…" aria-label="短语正文" spellcheck="false"></textarea><div class="editor-meta"><span id="characters"></span><span id="vimMode" role="status"></span><span class="spacer"></span><span id="saveState">已保存</span></div></div><footer class="footer"><button class="iconbutton danger" id="delete" aria-label="删除短语"><svg class="icon"><use href="#icon-trash"/></svg></button><span class="spacer"></span><span class="footer-shortcuts hint"><span>⌘S 保存</span>  ·  Esc <span>取消</span></span><button class="primary" id="save">保存</button></footer></div>
<div id="settings" class="page"><header class="head"><button class="iconbutton" data-back aria-label="返回短语"><svg class="icon"><use href="#icon-back"/></svg></button><strong>设置</strong><span class="spacer"></span><span class="subtle">Popaste</span></header><div class="settings"><div class="setting"><span>语言</span><select id="language" aria-label="语言"><option value="system">跟随系统</option><option value="zh-Hans">简体中文</option><option value="en">English</option></select></div><div class="setting"><span>快捷键方案</span><div class="shortcut-controls"><button class="shortcut" id="shortcut" aria-label="呼出快捷键">⌥ A</button><select id="keymap" aria-label="快捷键方案"><option value="emacs">Emacs</option><option value="vim">Vim</option></select></div></div><div class="setting"><span>Vim 编辑模式</span><button class="toggle" id="vimEditing" role="switch" aria-label="Vim 编辑模式" aria-checked="false"><i></i></button></div><div class="setting"><span>浮窗大小</span><div class="segments" aria-label="浮窗大小"><button data-scale="0.8" aria-pressed="false">小</button><button data-scale="0.9" aria-pressed="true">中</button><button data-scale="1" aria-pressed="false">大</button></div></div><div class="setting"><span>外观</span><select id="appearance" aria-label="外观"><option value="system">跟随系统</option><option value="light" selected>浅色</option><option value="dark">深色</option></select></div><div class="setting"><span>登录时启动</span><button class="toggle" id="login" role="switch" aria-label="登录时启动" aria-checked="false"><i></i></button></div><div class="setting"><span>辅助功能权限</span><button class="permission" id="permission">已授权 ›</button></div><div class="setting config-row"><div class="config-label"><span>配置文件</span><span class="config-path">~/.config/popeste</span></div><button class="textbutton" id="openDirectory">打开</button></div></div><footer class="footer"><span class="hint">更改后自动保存</span><span class="spacer"></span><button class="textbutton" data-back>完成</button></footer></div>
<div class="toast" id="toast" role="status"></div><div class="confirm" id="confirm" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><strong id="dialogTitle"></strong><p id="dialogText"></p><div class="dialog-actions"><button class="textbutton" id="stay">继续编辑</button><button class="textbutton" id="discardChanges" hidden></button><button class="primary" id="accept">放弃修改</button></div></div></div>
</section></div><div class="caption" id="caption"><strong>一个浮窗，完成常用操作。</strong><br>⌘N 新建 · ⌘E 编辑选中项 · ⌘, 设置</div></main><footer class="legend"><span>点击浮窗内的按钮体验 · 列表每行直接显示正文</span><span>交互设计稿 · 示例数据仅在本页有效</span></footer>
</div>

function t(text){return interfaceLanguage==='zh-Hans' ? text : (translatedText[interfaceLanguage]?.[text] || englishText[text] || text)}
let staticLabels=[];
function captureStaticLabels(){
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 while(walker.nextNode()){
  const node=walker.currentNode;
  if(node.parentElement.closest('script,style'))continue;
  const key=node.nodeValue.trim();
  if(englishText[key])staticLabels.push(()=>{node.nodeValue=t(key)});
 }
 document.querySelectorAll('[aria-label],[placeholder],[title]').forEach(el=>{
  for(const attr of ['aria-label','placeholder','title']){
   const key=el.getAttribute(attr);
   if(englishText[key])staticLabels.push(()=>el.setAttribute(attr,t(key)));
  }
 });
}
function localizeStatic(){document.documentElement.lang=interfaceLanguage;staticLabels.forEach(apply=>apply())}





// Keep marked IME text out of every filtering path, including background refreshes.
function createCommittedSearch(input, onCommit) {
    let value = input.value;
    let composing = false;
    function commit() {
        if (value === input.value) return;
        value = input.value;
        onCommit(value);
    }
    input.addEventListener('compositionstart', () => { composing = true; });
    input.addEventListener('compositionend', () => {
        composing = false;
        commit();
    });
    input.addEventListener('input', event => {
        if (composing || event.isComposing) return;
        commit();
    });
    return {
        get value() { return value; },
        get isComposing() { return composing; },
        reset() { composing = false; value = ''; input.value = ''; }
    };
}
if (typeof module !== 'undefined') module.exports = createCommittedSearch;

}if(recording){e.preventDefault();if(e.key==='Escape'){recording=false;send('recording',{enabled:false});$('shortcut').textContent=shortcut;return}if(['Meta','Control','Shift','Alt'].includes(e.key))return;if(!(e.metaKey||e.ctrlKey||e.altKey)){toast('请包含 ⌘ / ⌃ / ⌥');return}send('shortcut',{code:e.code,key:e.key,control:e.ctrlKey,option:e.altKey,command:e.metaKey,shift:e.shiftKey});recording=false;send('recording',{enabled:false});return}if(e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.shiftKey){const key=e.key.toLowerCase();if(key==='n'){e.preventDefault();edit(null);return}if(key===','){e.preventDefault();navigate('settings');return}if(key==='e'&&(view==='list'||view==='preview')){e.preventDefault();if(matches()[selected])edit(matches()[selected]);return}}if(view==='editor'&&(e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();save()}if(view==='editor'&&document.activeElement===$('body')&&vimEditor.handle(e))return;if(e.key==='Escape'){if(view!=='list')navigate('list');else send('dismiss')}if(view==='preview'&&navigationKey(e,'back')){e.preventDefault();show('list')}if(view==='preview'&&e.key==='Enter'&&matches().length){e.preventDefault();send('insert',{id:matches()[selected].id})}if(view==='list'){if(!listExpanded&&(e.key==='Enter'||['down','up','forward'].some(action=>navigationKey(e,action)))){e.preventDefault();selected=0;expandList();return;}if(navigationKey(e,'down')){e.preventDefault();selected++;render()}if(navigationKey(e,'up')){e.preventDefault();selected--;render()}if(e.key==='Enter'&&matches().length){e.preventDefault();send('insert',{id:matches()[selected].id})}if(navigationKey(e,'forward')&&matches().length){e.preventDefault();preview()}if(e.metaKey&&e.shiftKey&&e.key.toLowerCase()==='c'&&matches().length){e.preventDefault();send('copy',{body:matches()[selected].body})}}});render();

const previewPage=document.createElement('div');previewPage.id='preview';previewPage.className='page';
previewPage.innerHTML='<header class="head"><button class="iconbutton" aria-label="返回短语">←</button><strong>短语</strong><span class="spacer"></span><kbd>⌃B 返回</kbd></header><div class="editor"><textarea id="previewBody" readonly aria-label="短语正文" spellcheck="false"></textarea><div class="editor-meta" aria-hidden="true" style="visibility:hidden"><span>0</span></div></div><footer class="footer"><span class="hint">纯文本</span><span class="spacer"></span><button class="textbutton">编辑</button><button class="primary insert-button"><span>插入</span><svg class="icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M16 4v7H4m4-4-4 4 4 4"/></svg></button></footer>';
document.querySelector('.window').prepend(previewPage);

window.nativeState=next=>{

window.nativeOpen=destination=>{

  if(view==='list'){searchInput.reset();selected=0;listExpanded=false;syncLayout();render();$('query').focus()}

};
window.nativeSaveFailed=()=>{saving=false;afterSave=null;$('save').disabled=false};
