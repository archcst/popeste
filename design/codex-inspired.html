:8px}.prompt{width:100%;padding:11px 10px;display:flex;align-items:center;gap:12px;border-radius:7px;text-align:left;min-height:58px}.prompt.selected{background:var(--selected)}.prompt .icon{color:var(--muted)}.prompt.selected .icon{color:var(--text)}.prompt-copy{min-width:0;flex:1}.prompt strong{display:block;font-size:13px;font-weight:550;margin-bottom:5px}.prompt small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.return{font-size:14px;color:var(--muted)}.picker-footer{height:39px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 13px;font-size:10px;color:var(--muted)}.picker-footer button{padding:4px;border-radius:4px}.hints{display:flex;gap:10px}.settings{margin-top:29px}.settings-title{padding:14px 18px;font-size:13px;font-weight:550;border-bottom:1px solid var(--line)}.setting-rows{padding:0 18px}.setting-row{display:flex;align-items:center;justify-content:space-between;height:49px;border-bottom:1px solid var(--line);font-size:12px}.setting-row:last-child{border:0}.key{padding:5px 10px;border:1px solid var(--line);border-radius:5px;font-size:11px}.toggle{width:29px;height:17px;background:#b7b7af;border-radius:20px;padding:2px;display:flex;align-items:center}.toggle i{display:block;width:13px;height:13px;background:white;border-radius:50%;box-shadow:0 1px 2px #0002}.toggle.on{background:#575b4a;justify-content:flex-end}.status{font-size:11px;color:var(--muted)}.dot{width:5px;height:5px;background:#6b9479;display:inline-block;border-radius:50%;margin-right:6px}.settings-note{color:var(--muted);font-size:10px;padding:6px 18px 17px}.manager{display:grid;grid-template-columns:210px 1fr;height:730px}.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:0 10px}.traffic{display:flex;gap:7px;height:42px;align-items:center;padding-left:7px}.traffic i{height:10px;width:10px;border-radius:50%;background:#c9c8c1}.traffic i:first-child{background:#ec8b80}.traffic i:nth-child(2){background:#e3c474}.traffic i:nth-child(3){background:#98bc8c}.sidebrand{display:flex;align-items:center;gap:9px;padding:10px 9px 22px;font-weight:650;font-size:15px;letter-spacing:-.4px}.sidebrand .mark{font-size:22px;font-weight:400;line-height:16px}.action-row{display:flex;align-items:center;gap:10px;border-radius:6px;padding:9px;width:100%;text-align:left;font-size:12px}.action-row .icon{width:15px;height:15px}.section-label{color:var(--muted);font-size:10px;padding:24px 9px 9px}.side-row{display:flex;align-items:center;gap:9px;padding:10px 9px;border-radius:6px;width:100%;text-align:left;font-size:12px}.side-row.active{background:var(--selected)}.side-row .icon{width:14px;height:14px;color:var(--muted)}.side-row .pin{margin-left:auto;font-size:11px;color:var(--muted)}.side-bottom{margin-top:auto;border-top:1px solid var(--line);height:51px;display:flex;align-items:center;gap:4px}.side-bottom button{display:flex;align-items:center;gap:6px;padding:7px;font-size:11px;border-radius:5px;color:var(--muted)}.side-bottom button:last-child{margin-left:auto}.content{min-width:0;display:flex;flex-direction:column}.toolbar{height:51px;display:flex;align-items:center;justify-content:space-between;padding:0 23px;border-bottom:1px solid var(--line)}.crumb{font-size:11px;color:var(--muted)}.crumb span{color:var(--text);margin-left:10px}.tools{display:flex;gap:13px;color:var(--muted)}.tools button{padding:4px;border-radius:4px}.editor{padding:42px 34px 0;flex:1}.title-row{display:flex;align-items:center;justify-content:space-between}.title{font-size:25px;font-weight:600;letter-spacing:-.8px;width:100%}.sub{font-size:11px;color:var(--muted);margin-top:11px;margin-bottom:34px}.field-label{font-size:11px;color:var(--muted);margin-bottom:10px}.editor-box{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--canvas)}textarea{width:100%;height:320px;display:block;resize:none;border:0;background:transparent;outline:0;padding:20px;font-size:13px;line-height:1.95;letter-spacing:.1px}.editor-bottom{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;color:var(--muted);font-size:10px}.editor-bottom button{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);border-radius:4px;padding:3px}.editor-bottom .icon{width:13px;height:13px}.save-row{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.save-state{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px}.save-actions{display:flex;align-items:center;gap:8px}.save-actions button{font-size:12px;padding:8px 16px;border-radius:6px}.save-actions .primary{background:var(--button);color:var(--white)}.window-footer{padding:15px 24px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}.window-footer button{color:var(--muted);padding:4px}.note{margin-top:25px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:20px}.empty{color:var(--muted);padding:25px;text-align:center;font-size:12px}#previewText{white-space:pre-wrap;font-size:12px;line-height:1.8;padding:14px;min-height:350px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--button);color:var(--white);padding:10px 18px;border-radius:9px;opacity:0;pointer-events:none;font-size:12px}.toast.show{opacity:1}@media(max-width:1150px){.board{padding:28px 22px}.grid{grid-template-columns:310px minmax(560px,1fr);gap:20px}.manager{grid-template-columns:175px 1fr}.editor{padding:34px 24px 0}.hints{gap:5px}}@media(max-width:950px){.grid{grid-template-columns:1fr}.left{display:grid;grid-template-columns:1fr 1fr;gap:24px}.settings{margin:0}.manager{height:700px;grid-template-columns:210px 1fr}.board{max-width:850px}.head{margin-bottom:25px}}@media(max-width:600px){.left{grid-template-columns:1fr}.manager{grid-template-columns:145px 1fr}.editor{padding:24px 15px 0}.toolbar{padding:0 15px}.title{font-size:20px}.brand span{display:block;margin:8px 0 0}.note{display:block;line-height:1.8}}
</style>

<div class="board"><header class="head"><div class="brand">Popaste <span>设计方案 02 / Codex 风格</span></div><button id="theme">◐ &nbsp; 切换深色</button></header><main class="grid"><div class="left"><section><div class="caption">01 <b>快捷插入</b></div><div class="surface picker"><div class="search"><svg class="icon"><use href="#search"/></svg><input id="query" placeholder="搜索提示词…" aria-label="搜索提示词"><kbd>esc</kbd></div><div id="pickerList" class="picker-list"></div><div class="picker-footer"><button aria-label="新建提示词" onclick="newPrompt()"><svg class="icon"><use href="#plus"/></svg></button><div class="hints"><span>⌃N/P 选择</span><span>⌃F 预览</span><span>↵ 插入</span></div><button aria-label="设置" onclick="document.querySelector('.settings').scrollIntoView({behavior:'smooth'})"><svg class="icon"><use href="#gear"/></svg></button></div></div></section><section class="settings"><div class="caption">03 <b>偏好设置</b></div><div class="surface"><div class="settings-title">设置</div><div class="setting-rows"><div class="setting-row"><span>呼出快捷键</span><span class="key">⌥ A</span></div><div class="setting-row"><span>登录时启动</span><button class="toggle" role="switch" aria-checked="false" aria-label="登录时启动（设计演示）" onclick="this.classList.toggle('on');this.setAttribute('aria-checked',this.classList.contains('on'))"><i></i></button></div><div class="setting-row"><span>辅助功能权限</span><span class="status"><i class="dot"></i>已授权 &nbsp;›</span></div></div><div class="settings-note">用于定位输入光标与插入文本</div></div></section></div><section><div class="caption">02 <b>提示词管理</b></div><div class="surface manager"><aside class="sidebar"><div class="traffic"><i></i><i></i><i></i></div><div class="sidebrand"><span class="mark">❯</span> Popaste</div><button class="action-row" onclick="newPrompt()"><svg class="icon"><use href="#edit"/></svg>新建提示词</button><button class="action-row" onclick="document.getElementById('query').focus()"><svg class="icon"><use href="#search"/></svg>搜索提示词</button><div class="section-label">置顶</div><div id="pinnedList"></div><div class="section-label">全部提示词</div><div id="otherList"></div><div class="side-bottom"><button onclick="toast('设计演示 · 导入 JSON 备份')"><svg class="icon" style="transform:rotate(180deg)"><use href="#arrow"/></svg>导入</button><button onclick="toast('设计演示 · 导出提示词')"><svg class="icon"><use href="#arrow"/></svg>导出</button><button aria-label="设置" onclick="document.querySelector('.settings').scrollIntoView({behavior:'smooth'})"><svg class="icon"><use href="#gear"/></svg></button></div></aside><section class="content"><div class="toolbar"><div class="crumb">提示词 <span>/ &nbsp; <b id="crumb" style="font-weight:400">代码审查</b></span></div><div class="tools"><button id="pinButton" aria-label="置顶或取消置顶" onclick="pinPrompt()"><svg class="icon"><use href="#pin"/></svg></button><button aria-label="更多操作" onclick="toast('更多操作 · 复制 / 导出 / 删除')">•••</button></div></div><div class="editor"><div class="title-row"><input id="title" class="title" value="代码审查" aria-label="提示词标题"></div><div class="sub" id="subtitle">常用的代码审查提示词</div><div class="field-label">正文</div><div class="editor-box"><textarea id="body" spellcheck="false" aria-label="提示词正文"></textarea><div class="editor-bottom"><span>纯文本</span><button onclick="copyBody()"><svg class="icon"><use href="#copy"/></svg>复制</button></div></div><div class="save-row"><div class="save-state" id="saveState">✓ &nbsp;已保存到本机</div><div class="save-actions"><button onclick="selectPrompt(active)">取消</button><button class="primary" onclick="savePrompt()">保存</button></div></div></div><div class="window-footer"><button aria-label="删除提示词" onclick="toast('设计演示 · 删除前将要求确认')"><svg class="icon" style="width:14px;height:14px"><use href="#trash"/></svg></button><span>⌘ S 保存</span></div></section></div><div class="note"><span>暖灰侧栏 · 单色图标 · 轻分隔 · 黑色主操作</span><span>可交互设计稿 · 不修改应用数据</span></div></section></main></div><div class="toast" id="toast" role="status"></div>
<script>
const icons=['code','doc','translate','edit','doc','code'];const prompts=[{title:'代码审查',excerpt:'检查潜在问题，给出具体修改建议',body:'请帮我审查以下代码，重点关注：\n\n1. 潜在的逻辑错误与边界情况\n2. 可读性与可维护性\n3. 性能问题与改进建议\n\n请说明原因，并给出具体修改示例。',pinned:true},{title:'需求分析',excerpt:'梳理需求背景，分析核心功能与边界',body:'请根据以下描述分析需求：\n\n• 明确用户目标与使用场景\n• 列出核心功能与边界情况\n• 给出可验证的验收标准',pinned:true},{title:'中英翻译',excerpt:'将内容准确、自然地翻译成英文',body:'请将以下内容翻译成自然、准确的英文。\n\n保留原文语气与段落结构，专有名词保持一致。'},{title:'文字润色',excerpt:'优化表达，提升可读性与专业性',body:'请润色以下文字，保留原意。\n\n使用清晰、自然的表达，删去重复与空泛的句子。'},{title:'会议纪要',excerpt:'根据会议内容，整理结构化纪要',body:'请整理以下会议内容：\n\n1. 主要讨论事项\n2. 已确定的结论\n3. 待办事项、负责人和截止时间'},{title:'解释代码',excerpt:'逐行解释代码的功能与实现逻辑',body:'请解释以下代码的实现逻辑，并说明输入、输出与关键边界条件。'}];let active=0,selected=0,preview=false;const $=id=>document.getElementById(id);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icon=n=>`<svg class="icon"><use href="#${n}"/></svg>`;function matches(){let q=$('query').value.toLowerCase();return prompts.map((p,i)=>({...p,i})).filter(p=>(p.title+p.body).toLowerCase().includes(q))}function render(){['pinnedList','otherList'].forEach(id=>$(id).innerHTML='');prompts.forEach((p,i)=>{let el=document.createElement('button');el.className='side-row'+(i===active?' active':'');el.innerHTML=icon(icons[i]||'doc')+'<span>'+esc(p.title)+'</span>'+(p.pinned?'<span class="pin">⌁</span>':'');el.onclick=()=>selectPrompt(i);$(p.pinned?'pinnedList':'otherList').append(el)});renderPicker()}function renderPicker(){const rows=matches();selected=Math.max(0,Math.min(selected,rows.length-1));if(preview&&rows.length){$('pickerList').innerHTML='<div id="previewText">'+esc(rows[selected].body)+'</div>';return}$('pickerList').innerHTML=rows.length?rows.map((p,j)=>`<button class="prompt ${j===selected?'selected':''}" data-index="${j}">${icon(icons[p.i]||'doc')}<span class="prompt-copy"><strong>${esc(p.title)}</strong><small>${esc(p.excerpt||p.body.split('\n')[0])}</small></span>${j===selected?'<span class="return">↵</span>':''}</button>`).join(''):'<div class="empty">没有匹配的提示词</div>';$('pickerList').querySelectorAll('button').forEach(b=>{b.onclick=()=>{selected=+b.dataset.index;selectPrompt(rows[selected].i)};b.ondblclick=()=>toast('设计演示 · 插入「'+rows[selected].title+'」')})}function selectPrompt(i){active=i;const p=prompts[i];$('title').value=p.title;$('body').value=p.body;$('crumb').textContent=p.title;$('subtitle').textContent=p.excerpt||'写下你想重复使用的内容';$('saveState').textContent='✓ 已保存到本机';render()}function savePrompt(){if(!$('title').value.trim()||!$('body').value.trim()){toast('请填写标题和正文');return}prompts[active].title=$('title').value;prompts[active].body=$('body').value;$('crumb').textContent=$('title').value;$('saveState').textContent='✓ 已保存（仅本次演示）';render()}function newPrompt(){prompts.push({title:'未命名提示词',excerpt:'',body:''});selectPrompt(prompts.length-1);$('title').focus();$('title').select()}function pinPrompt(){prompts[active].pinned=!prompts[active].pinned;render();toast(prompts[active].pinned?'已置顶（演示）':'已取消置顶（演示）')}let timer;function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),2000)}async function copyBody(){try{await navigator.clipboard.writeText($('body').value);toast('正文已复制')}catch{toast('请选中正文后按 ⌘C 复制')}}$('query').oninput=()=>{selected=0;renderPicker()};$('query').onkeydown=e=>{let k=e.key.toLowerCase();if(e.isComposing)return;if(k==='arrowdown'||(e.ctrlKey&&k==='n')){e.preventDefault();selected++;renderPicker()}if(k==='arrowup'||(e.ctrlKey&&k==='p')){e.preventDefault();selected--;renderPicker()}if(e.ctrlKey&&(k==='f'||k==='b')){e.preventDefault();preview=k==='f';renderPicker()}if(k==='enter'&&matches().length){e.preventDefault();toast('设计演示 · 插入「'+matches()[selected].title+'」')}if(k==='escape'){$('query').value='';preview=false;renderPicker();$('query').blur()}};['title','body'].forEach(id=>$(id).oninput=()=>{$('saveState').textContent='有未保存的修改'});$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'◐  切换浅色':'◐  切换深色'};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();savePrompt()}});selectPrompt(0);
</script></html>
